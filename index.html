<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fourmulasteps - 高校数学 4ステップ思考法AI学習プラットフォーム</title>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('fatal-error-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'fatal-error-banner';
          el.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0f172a;color:#f87171;padding:24px;font-family:sans-serif;z-index:999999;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;';
          document.body.appendChild(el);
        }
        var msg = e.error ? (e.error.stack || e.error.message) : (e.message || String(e));
        el.innerHTML = '<div style="max-width:480px;background:#1e293b;padding:24px;border-radius:16px;border:1px solid #334155;box-shadow:0 10px 25px rgba(0,0,0,0.5);"><h3 style="color:#fff;margin:0 0 8px 0;font-size:18px;">アプリの読み込みでエラーが発生しました</h3><p style="color:#94a3b8;font-size:13px;margin:0 0 16px 0;">ブラウザのキャッシュをクリアして再読み込みしてください。</p><pre style="white-space:pre-wrap;word-break:break-all;background:#0f172a;padding:12px;border-radius:8px;font-size:11px;color:#fca5a5;text-align:left;max-height:160px;overflow:auto;">' + msg + '</pre><div style="margin-top:16px;display:flex;gap:8px;justify-content:center;"><button onclick="localStorage.clear();sessionStorage.clear();location.href=location.pathname+\'?t=\'+Date.now()+\'#app\';" style="padding:10px 16px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;">キャッシュ消去＆再読込</button></div></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled Rejection:', e.reason);
      });
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#94a3b8;font-family:sans-serif;gap:16px;">
        <div style="width:40px;height:40px;border:3px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p style="font-size:14px;letter-spacing:0.05em;color:#cbd5e1;">fourmulasteps を読み込み中...</p>
        <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
